[project]
name = "ffl-bigquery"
version = "0.1.0"
description = "Historical fantasy football ADP, usage, and coaching/scheme data → BigQuery: the fantasy layer on top of nfl-bigquery"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jason Blahovec" }]
requires-python = ">=3.11"
keywords = ["nfl", "fantasy-football", "adp", "nflverse", "bigquery", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "nflreadpy>=0.1,<1.0",
    "requests>=2.31,<3.0",
    "pandas>=2.0,<3.0",
    "google-cloud-bigquery>=3.20,<4.0",
    "pyarrow>=15.0,<19.0",
    "db-dtypes>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "build>=1.2.0",
    "truststore>=0.9",
]

[project.scripts]
ffl-bigquery = "ffl_bigquery.cli:main"

[project.urls]
Homepage = "https://github.com/blahovec-labs/ffl-bigquery"
Issues = "https://github.com/blahovec-labs/ffl-bigquery/issues"
Changelog = "https://github.com/blahovec-labs/ffl-bigquery/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffl_bigquery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit FFC/MFL/nflverse over the network; skipped in CI",
]
